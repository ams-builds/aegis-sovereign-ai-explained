<svg viewBox="0 0 1200 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">An IP check is not proof</title>
<desc id="desc">Weak: an IP address check trusts where the network says you are, a VPN changes the address, and the result is a false pass. Strong: a hardware-rooted check reads the TPM and location sensors, a policy checks the region, and only then is an identity issued.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="436" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">An IP check is not proof</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">HOW YOU KNOW WHERE YOUR AGENT RUNS</text>
<text x="40" y="98" text-anchor="start" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#7a8399">WEAK: YOU TRUST A CLAIM</text>
<rect x="40" y="110" width="320" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="200.0" y="143.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">IP address check</text>
<text x="200.0" y="156.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">where the network says you are</text>
<line x1="360" y1="146" x2="436" y2="146" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<rect x="440" y="110" width="320" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="600.0" y="143.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">A VPN changes the address</text>
<text x="600.0" y="156.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">the attacker looks local</text>
<line x1="760" y1="146" x2="836" y2="146" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<rect x="840" y="110" width="320" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="1000.0" y="143.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">False pass</text>
<text x="1000.0" y="156.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">the data leaves the zone</text>
<text x="40" y="224" text-anchor="start" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#7a8399">STRONG: YOU CHECK THE MACHINE</text>
<rect x="40" y="236" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="200.0" y="269.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Hardware-rooted check</text>
<text x="200.0" y="282.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">TPM and location sensors</text>
<line x1="360" y1="272" x2="436" y2="272" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="440" y="236" width="320" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="600.0" y="269.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Policy check</text>
<text x="600.0" y="282.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">is this an allowed region?</text>
<line x1="760" y1="272" x2="836" y2="272" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="840" y="236" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1000.0" y="269.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Identity issued</text>
<text x="1000.0" y="282.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">revoked if the machine changes</text>
<text x="600" y="350" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#7a8399">A VPN CAN CHANGE AN IP ADDRESS. IT CANNOT CHANGE THE MACHINE.</text>
<line x1="40" y1="372" x2="1160" y2="372" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="398" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">KEY</text>
<line x1="120" y1="396" x2="150" y2="396" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<text x="160" y="400" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">weak path: easy to spoof</text>
<rect x="640.0" y="388" width="30" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="680.0" y="400" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">where the decision happens</text>
</svg>
