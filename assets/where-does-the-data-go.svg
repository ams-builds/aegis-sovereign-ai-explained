<svg viewBox="0 0 1200 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Where does the data go?</title>
<desc id="desc">Your AI agent at work raises four sovereignty questions: where the data is processed, which law applies, whether you can prove where, and whether you can prove it without keeping more personal data.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="452" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">Where does the data go?</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">SOVEREIGNTY: FOUR QUESTIONS FOR THE AGENT YOU PUT TO WORK</text>
<rect x="400" y="96" width="400" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="406" y="102" width="30" height="16" rx="4" fill="#ececec"/>
<text x="421.0" y="114" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="600.0" y="126.1" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3142">Your AI agent at work</text>
<text x="600.0" y="139.1" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">model, tools, memory and logs</text>
<line x1="600" y1="160" x2="165" y2="236" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="240" width="250" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="46" y="246" width="30" height="16" rx="4" fill="#ececec"/>
<text x="61.0" y="258" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">ASK</text>
<text x="165.0" y="279.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Where is it processed?</text>
<text x="165.0" y="292.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">model, tools, storage, logs</text>
<line x1="600" y1="160" x2="455" y2="236" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="330" y="240" width="250" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="336" y="246" width="30" height="16" rx="4" fill="#ececec"/>
<text x="351.0" y="258" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">ASK</text>
<text x="455.0" y="279.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Which law applies?</text>
<text x="455.0" y="292.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">who can make you hand it over</text>
<line x1="600" y1="160" x2="745" y2="236" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="620" y="240" width="250" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="626" y="246" width="30" height="16" rx="4" fill="#ececec"/>
<text x="641.0" y="258" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">ASK</text>
<text x="745.0" y="279.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Can you prove where?</text>
<text x="745.0" y="292.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">an IP check is not proof</text>
<line x1="600" y1="160" x2="1035" y2="236" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="910" y="240" width="250" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="916" y="246" width="30" height="16" rx="4" fill="#ececec"/>
<text x="931.0" y="258" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">ASK</text>
<text x="1035.0" y="279.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Can you prove it with less data?</text>
<text x="1035.0" y="292.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">proofs, not raw prompts</text>
<text x="600" y="364" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#7a8399">SOVEREIGNTY NEEDS PROOF, NOT A PROMISE.</text>
<line x1="40" y1="388" x2="1160" y2="388" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="414" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">KEY</text>
<rect x="120" y="404" width="30" height="16" rx="4" fill="#ececec"/>
<text x="135.0" y="416" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="160" y="416" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">your agent at work</text>
<rect x="640.0" y="404" width="30" height="16" rx="4" fill="#ececec"/>
<text x="655.0" y="416" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">ASK</text>
<text x="680.0" y="416" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a question you must answer</text>
</svg>
